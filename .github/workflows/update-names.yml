name: Update Member Names

on:
  schedule:
    # 毎日 UTC 21:00 (= 日本時間 朝6:00) に自動実行
    - cron: '0 21 * * *'
  workflow_dispatch: {}   # Actionsタブから手動実行するためのトリガー

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch current nicknames
        run: python update_names.py

      - name: Commit and push data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update member names [skip ci]"
          git push
